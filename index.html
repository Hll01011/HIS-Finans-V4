<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HİS Finans V4 — Bağlantı Testi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">HİS Finans V4</div>
    <h1>Temiz Kurulum</h1>
    <p>Önce yalnızca Supabase bağlantısını doğruluyoruz. Bağlantı doğrulanmadan cari, banka, kasa veya diğer finans modülleri eklenmeyecek.</p>
    <div id="status" class="status loading">BAĞLANTI TEST EDİLİYOR…</div>
    <p id="detail">Supabase kimlik doğrulama servisine erişim kontrol ediliyor.</p>
    <div class="meta"><span>Supabase: V4</span><span>Süre: <strong id="time">—</strong></span></div>
    <button id="retry" type="button">Bağlantıyı Yeniden Test Et</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
